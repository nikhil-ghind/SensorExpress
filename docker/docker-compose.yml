version: "3.9"

services:
  # ── MQTT broker ───────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log

  # ── SensorExpress RT pipeline ─────────────────────────────────────────────
  sensor_express:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sensor_express
    restart: unless-stopped
    depends_on:
      - mosquitto
    network_mode: host           # host networking avoids NAT latency for RT
    cap_add:
      - SYS_NICE                 # Required for SCHED_FIFO / mlockall
      - IPC_LOCK
    ulimits:
      rtprio: 90
      memlock: -1
    environment:
      - MQTT_HOST=localhost
    volumes:
      - ../config:/app/config:ro
      - sensor_logs:/app/logs

  # ── Sensor simulator (Python) ─────────────────────────────────────────────
  simulator:
    image: python:3.11-slim
    container_name: sensor_simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
    network_mode: host
    working_dir: /sim
    volumes:
      - ../sim:/sim:ro
    command: >
      sh -c "pip install paho-mqtt -q &&
             python3 sensor_simulator.py --host localhost --port 1883 --hz 100"

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mosquitto_data:
  mosquitto_logs:
  sensor_logs:
  prometheus_data:
  grafana_data:
